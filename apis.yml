name: SuperMap Software Co., Ltd.

description: 'SuperMap Software Co., Ltd. develops and sells geographic information system (GIS) software and related platform technologies. Its product portfolio includes cloud and edge GIS servers, desktop, web, mobile, and component GIS applications, as well as solutions for smart cities, land management, natural resources, public safety, and disaster management. The company targets industries such as cadastre, transportation, energy, and municipal administrations that require geospatial data processing and analysis.'

